services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp_dev_pass
      POSTGRES_DB: chatapp_dev
    ports:
      # Host 5432 is often taken by another Postgres; 5433 avoids the clash.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Takes precedence over backend/.env so the container always reaches
      # the compose-managed postgres service.
      DATABASE_URL: postgresql://chatapp:chatapp_dev_pass@postgres:5432/chatapp_dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Bind-mount only the source tree — the container's node_modules
      # (built for Linux inside the image) are never overwritten by the host.
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./README.md:/app/README.md:ro
    command: >
      sh -c "pnpm prisma generate &&
             pnpm prisma migrate deploy &&
             pnpm run start:dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    volumes:
      # Full bind-mount for HMR.
      # The two anonymous volumes below shadow the host directories so the
      # container's node_modules and .next cache are preserved across restarts.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: pnpm run dev

  livekit:
    image: livekit/livekit-server
    container_name: livekit
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    command: >
      --dev
      --bind 0.0.0.0
    env_file:
      - .env
    environment:
      LIVEKIT_LOG_LEVEL: debug

volumes:
  postgres_data:
